<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9608a"/>
      <stop offset="100%" stop-color="#9a6fc9"/>
    </linearGradient>
  </defs>

  <!-- 收工 Shougong 主畫面圖示：滿版糖果粉→紫漸層（系統會自動加圓角 / 遮罩，所以不畫圓角） -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 白色品牌標誌（圓弧＋打勾＋上升箭頭），縮在中央 80% 安全區內，maskable 圓形遮罩不會裁到 -->
  <g transform="translate(96 96) scale(8)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="15.5" stroke-width="3.2" stroke-dasharray="66 32" transform="rotate(118 20 20)"/>
    <path d="M12.5 20.5l5 5 10.5-11.5" stroke-width="3.8"/>
    <path d="M22.8 13.8H28.4V19.4" stroke-width="3.4"/>
  </g>
</svg>
